_svd: ../svd/fixed/ch32v20x.svd

"*":
  _strip:
    - "R8_"
    - "R16_"
    - "R32_"
  _strip_end:
    - "_"
  "*":
    _strip:
      - "R8_"
      - "R16_"
      - "R32_"
      - "RB_"
      - " "
    _strip_end:
      - "_"

_modify:
  name: CH32V20x
  _peripherals:
    USB:
      # Include the 0x40006000..0x400063FF shared USBD/CAN SRAM window.
      addressBlock:
        offset: 0x0
        size: 0x800
        usage: registers

_include:
  - ../peripherals/systick_v4.yaml

# CH32V20x DMA1 has channels 1-8. Keep this V2-specific so the shared V3 DMA patch stays unchanged.
DMA1:
  _cluster:
    "CHL%s":
      description: "Channel cluster: CFGR?, CNTR?, PADDR?, and MADDR? registers"
      "CFGR[12345678]":
        name: CFGR
      "CNTR[12345678]":
        name: CNTR
      "PADDR[12345678]":
        name: PADDR
      "MADDR[12345678]":
        name: MADDR
  _add:
    _interrupts:
      DMA1_Channel8:
        description: DMA1 channel 8 global interrupt
        value: 67

# CH32V203 excluding CH32V203RB
RCC:
  CFGR0:
    MCO:
      NoMCO: [0, "No clock"]
      SYSCLK: [0b0100, "System clock (SYSCLK)"]
      HSI: [0b0101, "Internal 8MHz RC oscillator clock (HSI)"]
      HSE: [0b0110, "External oscillator clock (HSE)"]
      PLL_Div2: [0b0111, "PLL clock divided by 2 (PLL/2)"]
      PLL2: [0b1000, "PLL2 clock"]
      PLL3_Div2: [0b1001, "PLL3 clock divided by 2 (PLL3/2)"]
      XT1: [0b1010, "XT1 external oscillator clock"]
      PLL3: [0b1011, "PLL3 clock"]
    USBPRE:
      Div1: [0b00, "Not divided (when PLLCLK=48MHz)"]
      Div2: [0b01, "Divided by 2 (when PLLCLK=96MHz)"]
      Div3: [0b10, "Divided by 3 (when PLLCLK=144MHz)"]
    PPRE2:
      Div1: [0b000, "HCLK not divided"]
      Div2: [0b100, "HCLK divided by 2"]
      Div4: [0b101, "HCLK divided by 4"]
      Div8: [0b110, "HCLK divided by 8"]
      Div16: [0b111, "HCLK divided by 16"]
    PPRE1:
      Div1: [0b000, "HCLK not divided"]
      Div2: [0b100, "HCLK divided by 2"]
      Div4: [0b101, "HCLK divided by 4"]
      Div8: [0b110, "HCLK divided by 8"]
      Div16: [0b111, "HCLK divided by 16"]
    HPRE:
      Div1: [0b0000, "SYSCLK not divided"]
      Div2: [0b1000, "SYSCLK divided by 2"]
      Div4: [0b1001, "SYSCLK divided by 4"]
      Div8: [0b1010, "SYSCLK divided by 8"]
      Div16: [0b1011, "SYSCLK divided by 16"]
      Div64: [0b1100, "SYSCLK divided by 64"]
      Div128: [0b1101, "SYSCLK divided by 128"]
      Div256: [0b1110, "SYSCLK divided by 256"]
      Div512: [0b1111, "SYSCLK divided by 512"]
    SWS:
      HSI: [0b00, "HSI oscillator used as system clock"]
      HSE: [0b01, "HSE oscillator used as system clock"]
      PLL: [0b10, "PLL used as system clock"]
    SW:
      HSI: [0b00, "HSI selected as system clock"]
      HSE: [0b01, "HSE selected as system clock"]
      PLL: [0b10, "PLL selected as system clock"]

  # CH32V20x_D8-only interrupt entries missing from the vendor SVD.
  # IRQ 63 and 64 are reserved on CH32V20x_D8.
  _add:
    _interrupts:
      OSC32KCal:
        description: OSC32K calibration global interrupt
        value: 68
      OSCWakeUp:
        description: OSC32K wakeup interrupt
        value: 69

  # CH32V203 has CAN1 only. CAN2 clock/reset controls are reserved for this PAC.
  APB1PRSTR:
    _delete:
      - CAN2RST
  APB1PCENR:
    _delete:
      - CAN2EN

# CH32V203 has CAN1 only. CAN2 remapping is not exposed by the V203 PAC.
AFIO:
  PCFR:
    _delete:
      - CAN2RM

# OPA3/OPA4 are not applicable to CH32V20x. Keep OPA1/OPA2 in the common V203 PAC.
OPA:
  CR:
    _delete:
      - EN3
      - MODE3
      - NSEL3
      - PSEL3
      - EN4
      - MODE4
      - NSEL4
      - PSEL4

# CH32V203 CAN1 corrections against Chapter 24 of the reference manual.
# Filter-bank registers F0R1..F27R2 remain present: the manual lists all 28
# registers in the CAN1 filter-table address range, even though CAN1 control
# bits apply to banks 0..13 and CAN2 control bits apply to banks 14..27.
CAN1:
  _add:
    TTCTLR:
      description: CAN1 time trigger control register
      addressOffset: 0x20
      size: 32
      access: read-write
      resetValue: 0x0000FFFF
      fields:
        TIMCMV:
          description: Internal counter count end value
          bitOffset: 0
          bitWidth: 16
          access: read-write
        TIMRST:
          description: Internal counter reset control
          bitOffset: 16
          bitWidth: 1
          access: write-only
          modifiedWriteValues: oneToSet
        MODE:
          description: Time-triggered mode selection
          bitOffset: 17
          bitWidth: 1
          access: read-write
    TTCNT:
      description: CAN1 time trigger count value register
      addressOffset: 0x24
      size: 32
      access: read-write
      resetValue: 0x00000000
      fields:
        TIMCNT:
          description: Time-triggered count value
          bitOffset: 0
          bitWidth: 16
          access: read-write

  CTLR:
    _modify:
      RESET:
        modifiedWriteValues: oneToSet
  STATR:
    _modify:
      "SLAKI,WKUI,ERRI":
        modifiedWriteValues: oneToClear
  TSTATR:
    _modify:
      "ABRQ2,ABRQ1,ABRQ0":
        modifiedWriteValues: oneToSet
      "TERR2,ALST2,TXOK2,RQCP2,TERR1,ALST1,TXOK1,RQCP1,TERR0,ALST0,TXOK0,RQCP0":
        modifiedWriteValues: oneToClear
  RFIFO0:
    _modify:
      RFOM0:
        modifiedWriteValues: oneToSet
      "FOVR0,FULL0":
        modifiedWriteValues: oneToClear
  RFIFO1:
    _modify:
      RFOM1:
        modifiedWriteValues: oneToSet
      "FOVR1,FULL1":
        modifiedWriteValues: oneToClear

USB:
  # USBD_CNTR.PDWN is status-only on CH32V20x. The register reset value already
  # leaves this bit at 1; only the field access needs to be corrected.
  CNTR:
    _modify:
      PDWN:
        access: read-only

  # USBD endpoint registers have mixed write semantics.  Keep those semantics in
  # the SVD so svd2rust does not expose ordinary read/modify/write behavior for
  # bits that are cleared by writing 0 or toggled by writing 1.
  "EP0R,EP1R,EP2R,EP3R,EP4R,EP5R,EP6R,EP7R":
    _modify:
      CTR_TX:
        description: Correct transfer for transmission; write 0 to clear and write 1 has no effect
        modifiedWriteValues: zeroToClear
      CTR_RX:
        description: Correct transfer for reception; write 0 to clear and write 1 has no effect
        modifiedWriteValues: zeroToClear
      DTOG_TX:
        description: Transmit data toggle; writing 1 toggles the bit and writing 0 has no effect
        modifiedWriteValues: oneToToggle
      DTOG_RX:
        description: Receive data toggle; writing 1 toggles the bit and writing 0 has no effect
        modifiedWriteValues: oneToToggle
      STAT_TX:
        description: Transmit status bits; writing 1 toggles each written bit and writing 0 has no effect
        modifiedWriteValues: oneToToggle
      STAT_RX:
        description: Receive status bits; writing 1 toggles each written bit and writing 0 has no effect
        modifiedWriteValues: oneToToggle
      SETUP:
        description: SETUP transaction transfer completion flag
        access: read-only

  ISTR:
    _modify:
      "EP_ID,DIR,CTR":
        access: read-only
      "ESOF,SOF,RESET,SUSP,WKUP,ERR,PMAOVR":
        description: Interrupt flag; write 0 to clear and write 1 has no effect
        modifiedWriteValues: zeroToClear

  _modify:
    # Reference manual defines USBD_BTABLE as R16_USBD_BTABLE.
    BTABLE:
      size: 16

  _add:
    # The USBD buffer descriptor table base is programmable through BTABLE, so
    # fixed ADDRx/COUNTx register names would only be correct while BTABLE=0.
    # Expose the complete 512-byte USBD/CAN shared SRAM as 256 raw 16-bit words.
    # CPU-visible words are spaced by 4 bytes: 0x40006000..0x400063FC.
    PMA_WORD%s:
      description: USBD/CAN shared packet memory halfword
      addressOffset: 0x400
      size: 16
      access: read-write
      dim: 256
      dimIncrement: 0x4
      fields:
        DATA:
          description: USBD/CAN shared packet memory halfword data
          bitOffset: 0
          bitWidth: 16
          access: read-write

USB_OTG_FS:
  _delete:
    _registers:
      - USBHD_UDEV_CTRL__USBHD_UHOST_CTRL
      - UEP2_3_MOD__UH_EP_MOD
      - UEP2_DMA__UH_RX_DMA
      - UEP3_DMA__UH_TX_DMA
      - UEP1_T_CTRL___USBHD_UH_SETUP
      - UEP2_T_LEN__USBHD_UH_EP_PID
      - UEP2_R_CTRL__USBHD_UH_RX_CTRL
      - UEP3_T_LEN__USBHD_UH_TX_LEN
      - UEP3_T_CTRL__USBHD_UH_TX_CTRL
      # Reference manual marks USB_OTG_CR/SR as not applicable to CH32V20x.
      - USB_OTG_CR
      - USB_OTG_SR
    _interrupts:
      - OTG_FS

  _modify:
    USBHD_BASE_CTRL:
      resetValue: 0x06
    USB_INT_FG:
      resetValue: 0x20
    "UEP0_T_LEN,UEP1_T_LEN,UEP4_T_LEN,UEP5_T_LEN,UEP6_T_LEN,UEP7_T_LEN":
      size: 16
    _interrupts:
      USBHS:
        name: USBFS
        description: USBFS global interrupt
        value: 59
      USBHSWakeup:
        name: USBFSWakeUp
        description: USBFS wakeup interrupt
        value: 60

  USB_INT_EN:
    _delete:
      - USBHD_UIE_DEV_SOF

  USB_INT_FG:
    _modify:
      "UIF_BUS_RST__UIF_DETECT,UIF_TRANSFER,UIF_SUSPEND,UIF_HST_SOF,UIF_FIFO_OV":
        modifiedWriteValues: oneToClear

  _add:
    # 0x50000001
    USBHD_UDEV_CTRL:
      description: USB device physical port control register
      addressOffset: 0x01
      size: 8
      fields:
        UD_PD_DIS:
          description: USB device port UD+/UD- pin internal pull-down resistor control
          bitOffset: 7
          bitWidth: 1
          access: read-write
        UD_DP_PIN:
          description: USB device port UD+ pin status
          bitOffset: 5
          bitWidth: 1
          access: read-only
        UD_DM_PIN:
          description: USB device port UD- pin status
          bitOffset: 4
          bitWidth: 1
          access: read-only
        UD_LOW_SPEED:
          description: USB device port low speed enable
          bitOffset: 2
          bitWidth: 1
          access: read-write
        UD_GP_BIT:
          description: USB device port general purpose bit
          bitOffset: 1
          bitWidth: 1
          access: read-write
        UD_PORT_EN:
          description: USB device port enable
          bitOffset: 0
          bitWidth: 1
          access: read-write
    UHOST_CTRL:
      description: USB host physical port control register
      addressOffset: 0x01
      size: 8
      access: read-write
      fields:
        UH_PD_DIS:
          description: Internal pull-down resistor control for USB host port UD+/UD- pins
          bitOffset: 7
          bitWidth: 1
        UH_DP_PIN:
          description: Current UD+ pin status
          bitOffset: 5
          bitWidth: 1
          access: read-only
        UH_DM_PIN:
          description: Current UD- pin status
          bitOffset: 4
          bitWidth: 1
          access: read-only
        UH_LOW_SPEED:
          description: USB host port low speed enable
          bitOffset: 2
          bitWidth: 1
        UH_BUS_RESET:
          description: USB host port bus reset
          bitOffset: 1
          bitWidth: 1
        UH_PORT_EN:
          description: USB host port enable
          bitOffset: 0
          bitWidth: 1
    UEP2_3_MOD:
      description: Endpoint 2/3 mode control register
      addressOffset: 0x0D
      size: 8
      access: read-write
      fields:
        UEP3_RX_EN:
          bitOffset: 7
          bitWidth: 1
        UEP3_TX_EN:
          bitOffset: 6
          bitWidth: 1
        UEP3_BUF_MOD:
          bitOffset: 4
          bitWidth: 1
        UEP2_RX_EN:
          bitOffset: 3
          bitWidth: 1
        UEP2_TX_EN:
          bitOffset: 2
          bitWidth: 1
        UEP2_BUF_MOD:
          bitOffset: 0
          bitWidth: 1
    UH_EP_MOD:
      description: USB host endpoint mode control register
      addressOffset: 0x0D
      size: 8
      access: read-write
      fields:
        UH_EP_TX_EN:
          bitOffset: 6
          bitWidth: 1
        UH_EP_TBUF_MOD:
          bitOffset: 4
          bitWidth: 1
        UH_EP_RX_EN:
          bitOffset: 3
          bitWidth: 1
        UH_EP_RBUF_MOD:
          bitOffset: 0
          bitWidth: 1
    UEP2_DMA:
      addressOffset: 0x18
      size: 32
      access: read-write
      fields:
        UEP2_DMA:
          bitOffset: 0
          bitWidth: 32
    # Keep 32-bit access here: WCH's CH32V20x USBFS host struct uses uint32_t for HOST_RX_DMA/HOST_TX_DMA.
    UH_RX_DMA:
      addressOffset: 0x18
      size: 32
      access: read-write
      fields:
        UH_RX_DMA:
          bitOffset: 0
          bitWidth: 32
    UEP3_DMA:
      addressOffset: 0x1C
      size: 32
      access: read-write
      fields:
        UEP3_DMA:
          bitOffset: 0
          bitWidth: 32
    UH_TX_DMA:
      addressOffset: 0x1C
      size: 32
      access: read-write
      fields:
        UH_TX_DMA:
          bitOffset: 0
          bitWidth: 32

    UEP1_TX_CTRL:
      addressOffset: 0x36
      size: 8
      access: read-write
    UEP2_T_LEN:
      addressOffset: 0x38
      size: 16
      access: read-write
    UEP2_RX_CTRL:
      addressOffset: 0x3B
      size: 8
      access: read-write
    UEP3_T_LEN:
      addressOffset: 0x3C
      size: 16
      access: read-write
    UEP3_TX_CTRL:
      addressOffset: 0x3E
      size: 8
      access: read-write

    UH_SETUP:
      addressOffset: 0x36
      size: 16
      access: read-write
    UH_EP_PID:
      addressOffset: 0x38
      size: 8
      access: read-write
    UH_RX_CTRL:
      addressOffset: 0x3B
      size: 8
      access: read-write
    UH_TX_LEN:
      addressOffset: 0x3C
      size: 16
      access: read-write
    UH_TX_CTRL:
      addressOffset: 0x3E
      size: 8
      access: read-write

# CH32V20x_D8 interrupt layout used as the generated baseline.
# fix_ch32v20x_variants.py derives the D6 interrupt enum/vector table only;
# all peripheral/register definitions remain one CH32V20x superset.
ETHERNET_MAC:
  # Chapter 27.2 10BASE-T Ethernet controller used by CH32F208/CH32V203/CH32V208.
  # The vendor SVD contains the Chapter 27.1 STM32-like MAC register layout for
  # CH32F207/CH32V307/CH32V317 instead, so replace the MAC register block here.
  _delete:
    _registers:
      - MACCR
      - MACFFR
      - MACHTHR
      - MACHTLR
      - MACMIIAR
      - MACMIIDR
      - MACFCR
      - MACVLANTR
      - MACRWUFFR
      - MACPMTCSR
      - MACSR
      - MACIMR
      - MACA0HR
      - MACA0LR
      - MACA1HR
      - MACA1LR
      - MACA2HR
      - MACA2LR
      - MACA3HR
      - MACA3LR

  _modify:
    description: 10M Ethernet controller
    _interrupts:
      ETH:
        value: 61
      ETH_WKUP:
        value: 62

  _add:
    EIE:
      description: Ethernet interrupt enable register
      addressOffset: 0x03
      size: 8
      access: read-write
      resetValue: 0x00
      fields:
        INTIE:
          description: Ethernet global interrupt enable
          bitOffset: 7
          bitWidth: 1
        RXIE:
          description: Receive completed interrupt enable
          bitOffset: 6
          bitWidth: 1
        LINKIE:
          description: Link change interrupt enable
          bitOffset: 4
          bitWidth: 1
        TXIE:
          description: Transmit completed interrupt enable
          bitOffset: 3
          bitWidth: 1
        R_EN50:
          description: Built-in 50-ohm impedance matching resistor enable
          bitOffset: 2
          bitWidth: 1
        TXERIE:
          description: Transmit error interrupt enable
          bitOffset: 1
          bitWidth: 1
        RXERIE:
          description: Receive error interrupt enable
          bitOffset: 0
          bitWidth: 1

    EIR:
      description: Ethernet interrupt flag register
      addressOffset: 0x04
      size: 8
      access: read-write
      resetValue: 0x00
      fields:
        RXIF:
          description: Receive completed flag; write 1 to clear
          bitOffset: 6
          bitWidth: 1
          modifiedWriteValues: oneToClear
        LINKIF:
          description: Link change flag; write 1 to clear
          bitOffset: 4
          bitWidth: 1
          modifiedWriteValues: oneToClear
        TXIF:
          description: Transmit completed flag; write 1 to clear
          bitOffset: 3
          bitWidth: 1
          modifiedWriteValues: oneToClear
        TXERIF:
          description: Transmit error flag; write 1 to clear
          bitOffset: 1
          bitWidth: 1
          modifiedWriteValues: oneToClear
        RXERIF:
          description: Receive error flag; write 1 to clear
          bitOffset: 0
          bitWidth: 1
          modifiedWriteValues: oneToClear

    ESTAT:
      description: Ethernet status register
      addressOffset: 0x05
      size: 8
      access: read-write
      resetValue: 0x00
      fields:
        INT:
          description: Ethernet interrupt status; write 1 to clear
          bitOffset: 7
          bitWidth: 1
          modifiedWriteValues: oneToClear
        BUFER:
          description: Buffer error status; write 1 to clear
          bitOffset: 6
          bitWidth: 1
          modifiedWriteValues: oneToClear
        RXCRCER:
          description: Receive CRC error status
          bitOffset: 5
          bitWidth: 1
          access: read-only
        RXNIBBLE:
          description: Receive nibble error status
          bitOffset: 4
          bitWidth: 1
          access: read-only
        RXMORE:
          description: Received packet exceeded configured maximum length
          bitOffset: 3
          bitWidth: 1
          access: read-only
        RXBUSY:
          description: Receive in progress
          bitOffset: 2
          bitWidth: 1
          access: read-only
        TXABRT:
          description: Transmission interrupted by MCU
          bitOffset: 1
          bitWidth: 1
          access: read-only

    ECON2:
      description: PHY analog parameter setting register
      addressOffset: 0x06
      size: 8
      access: read-write
      resetValue: 0x0A
      fields:
        RX_MUST:
          description: PHY receive analog tuning field; preserve the documented required value
          bitOffset: 1
          bitWidth: 3
        TX:
          description: Transmitter energy-saving driver control
          bitOffset: 0
          bitWidth: 1

    ECON1:
      description: Ethernet receive/transmit control register
      addressOffset: 0x07
      size: 8
      access: read-write
      resetValue: 0x00
      fields:
        TXRST:
          description: Transmit module reset
          bitOffset: 7
          bitWidth: 1
        RXRST:
          description: Receive module reset
          bitOffset: 6
          bitWidth: 1
        TXRTS:
          description: Start transmission; hardware clears after completion
          bitOffset: 3
          bitWidth: 1
        RXEN:
          description: Receive enable
          bitOffset: 2
          bitWidth: 1

    # The reference manual marks ETH_TX/ETXST/ETXLN reset values as unknown.
    # The source SVD has a device-wide resetValue=0, so the generated zero
    # Resettable impls are removed by fix_ch32v20x_variants.py.
    ETH_TX:
      description: Transmit DMA control register alias
      addressOffset: 0x08
      size: 32
      access: read-write
      fields:
        ETXST:
          description: Transmit DMA buffer start address
          bitOffset: 0
          bitWidth: 16
        ETXLN:
          description: Transmission length
          bitOffset: 16
          bitWidth: 16

    ETXST:
      description: Transmit DMA buffer start address register
      addressOffset: 0x08
      size: 16
      access: read-write
      fields:
        ETXST:
          description: Transmit DMA buffer start address; address must be 4-byte aligned
          bitOffset: 0
          bitWidth: 16

    ETXLN:
      description: Ethernet transmission length register
      addressOffset: 0x0A
      size: 16
      access: read-write
      fields:
        ETXLN:
          description: Transmission length
          bitOffset: 0
          bitWidth: 16

    ETH_RX:
      description: Receive DMA control register alias
      addressOffset: 0x0C
      size: 32
      access: read-write
      resetValue: 0x00000000
      fields:
        ERXST:
          description: Receive DMA buffer start address
          bitOffset: 0
          bitWidth: 16
        ERXLN:
          description: Reception length
          bitOffset: 16
          bitWidth: 16
          access: read-only

    ERXST:
      description: Receive DMA buffer start address register
      addressOffset: 0x0C
      size: 16
      access: read-write
      resetValue: 0x0000
      fields:
        ERXST:
          description: Receive DMA buffer start address; address must be 4-byte aligned
          bitOffset: 0
          bitWidth: 16

    ERXLN:
      description: Ethernet reception length register
      addressOffset: 0x0E
      size: 16
      access: read-only
      resetValue: 0x0000
      fields:
        ERXLN:
          description: Reception length
          bitOffset: 0
          bitWidth: 16

    HTL:
      description: Ethernet hash table low register
      addressOffset: 0x10
      size: 32
      access: read-write
      resetValue: 0x484EA033
      fields:
        EHT0:
          description: Hash table byte 0
          bitOffset: 0
          bitWidth: 8
        EHT1:
          description: Hash table byte 1
          bitOffset: 8
          bitWidth: 8
        EHT2:
          description: Hash table byte 2
          bitOffset: 16
          bitWidth: 8
        EHT3:
          description: Hash table byte 3
          bitOffset: 24
          bitWidth: 8

    HTH:
      description: Ethernet hash table high register
      addressOffset: 0x14
      size: 32
      access: read-write
      resetValue: 0x5000EF97
      fields:
        EHT4:
          description: Hash table byte 4
          bitOffset: 0
          bitWidth: 8
        EHT5:
          description: Hash table byte 5
          bitOffset: 8
          bitWidth: 8
        EHT6:
          description: Hash table byte 6
          bitOffset: 16
          bitWidth: 8
        EHT7:
          description: Hash table byte 7
          bitOffset: 24
          bitWidth: 8

    ETH_MACON:
      description: MAC control register alias
      addressOffset: 0x18
      size: 32
      access: read-write
      resetValue: 0x10000000
      fields:
        ERXFCON:
          description: Receive packet filter control byte
          bitOffset: 0
          bitWidth: 8
        MACON1:
          description: MAC layer flow control byte
          bitOffset: 8
          bitWidth: 8
        MACON2:
          description: MAC layer packet control byte
          bitOffset: 16
          bitWidth: 8
        MABBIPG:
          description: Minimum packet interval byte
          bitOffset: 24
          bitWidth: 8

    ERXFCON:
      description: Ethernet receive packet filter control register
      addressOffset: 0x18
      size: 8
      access: read-write
      resetValue: 0x00
      fields:
        UCEN:
          description: Unicast match filter enable
          bitOffset: 7
          bitWidth: 1
        CRCEN:
          description: Receive packets with CRC errors
          bitOffset: 5
          bitWidth: 1
        EN:
          description: Receive filtering enable
          bitOffset: 4
          bitWidth: 1
        MPEN:
          description: Magic packet filter enable
          bitOffset: 3
          bitWidth: 1
        HTEN:
          description: Hash table match filter enable
          bitOffset: 2
          bitWidth: 1
        MCEN:
          description: Multicast receive enable
          bitOffset: 1
          bitWidth: 1
        BCEN:
          description: Broadcast receive enable
          bitOffset: 0
          bitWidth: 1

    MACON1:
      description: Ethernet MAC layer flow control register
      addressOffset: 0x19
      size: 8
      access: read-write
      resetValue: 0x00
      fields:
        FCEN:
          description: Pause frame mode
          bitOffset: 4
          bitWidth: 2
        TXPAUS:
          description: Transmit pause frame enable
          bitOffset: 3
          bitWidth: 1
        RXPAUS:
          description: Receive pause frame enable
          bitOffset: 2
          bitWidth: 1
        PASSALL:
          description: Pass unfiltered control frames to buffer
          bitOffset: 1
          bitWidth: 1
        MARXEN:
          description: MAC layer receive enable
          bitOffset: 0
          bitWidth: 1

    MACON2:
      description: Ethernet MAC layer packet control register
      addressOffset: 0x1A
      size: 8
      access: read-write
      resetValue: 0x00
      fields:
        PADCFG:
          description: Short packet padding configuration
          bitOffset: 5
          bitWidth: 3
        TXCRCEN:
          description: Transmit CRC append enable
          bitOffset: 4
          bitWidth: 1
        PHDREN:
          description: Exclude special four bytes from CRC
          bitOffset: 3
          bitWidth: 1
        HFRMEN:
          description: Jumbo frame receive enable
          bitOffset: 2
          bitWidth: 1
        FULDPX:
          description: Full-duplex mode enable
          bitOffset: 0
          bitWidth: 1

    MABBIPG:
      description: Ethernet minimum packet interval register
      addressOffset: 0x1B
      size: 8
      access: read-write
      resetValue: 0x10
      fields:
        MABBIPG:
          description: Minimum number of packet interval bytes
          bitOffset: 0
          bitWidth: 7

    # ETH_TIM/EPAUS reset values are also documented as unknown.
    ETH_TIM:
      description: Flow control timing register alias
      addressOffset: 0x1C
      size: 32
      access: read-write
      fields:
        EPAUS:
          description: Flow control pause frame time
          bitOffset: 0
          bitWidth: 16
        MAMXFL:
          description: Maximum receive packet length
          bitOffset: 16
          bitWidth: 16

    EPAUS:
      description: Ethernet flow control pause frame time register
      addressOffset: 0x1C
      size: 16
      access: read-write
      fields:
        EPAUS:
          description: Flow control pause frame time
          bitOffset: 0
          bitWidth: 16

    MAMXFL:
      description: Ethernet maximum receive packet length register
      addressOffset: 0x1E
      size: 16
      access: read-write
      resetValue: 0x0000
      fields:
        MAMXFL:
          description: Maximum receive packet length
          bitOffset: 0
          bitWidth: 16

    MIRD:
      description: Ethernet MII read register
      addressOffset: 0x20
      size: 16
      access: read-write
      resetValue: 0x1100
      fields:
        MIRD:
          description: MII read data
          bitOffset: 0
          bitWidth: 16

    ETH_MIWR:
      description: MII access register alias
      addressOffset: 0x24
      size: 32
      access: read-write
      resetValue: 0x00000000
      fields:
        MIREGADR:
          description: PHY register address control byte
          bitOffset: 0
          bitWidth: 8
        MISTAT:
          description: MII status byte
          bitOffset: 8
          bitWidth: 8
          access: read-only
        MIWR:
          description: MII write data
          bitOffset: 16
          bitWidth: 16
          access: write-only

    MIREGADR:
      description: Ethernet MII address register
      addressOffset: 0x24
      size: 8
      access: read-write
      resetValue: 0x00
      fields:
        MIRDL:
          description: PHY register address
          bitOffset: 0
          bitWidth: 5

    MISTAT:
      description: Ethernet MII status register
      addressOffset: 0x25
      size: 8
      access: read-only
      resetValue: 0x00
      fields:
        MII_STA:
          description: MII register operation status
          bitOffset: 0
          bitWidth: 1

    MIWR:
      description: Ethernet MII write register
      addressOffset: 0x26
      size: 16
      access: write-only
      resetValue: 0x0000
      fields:
        MIWR:
          description: MII write data
          bitOffset: 0
          bitWidth: 16

    # The hardware MAC address reset contents are device-specific/unknown,
    # therefore Resettable must not synthesize zero for MAADRL/MAADRH.
    MAADRL:
      description: Ethernet MAC address low register
      addressOffset: 0x28
      size: 32
      access: read-write
      fields:
        MAADRL:
          description: MAC address bytes 1 to 4
          bitOffset: 0
          bitWidth: 32

    MAADRH:
      description: Ethernet MAC address high register
      addressOffset: 0x2C
      size: 16
      access: read-write
      fields:
        MAADRH:
          description: MAC address bytes 5 to 6
          bitOffset: 0
          bitWidth: 16

