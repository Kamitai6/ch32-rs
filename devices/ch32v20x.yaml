USBHD:
  # Chapter 22 USBHS/USBHD register model.  Keep this block as part of the
  # CH32V20x superset even when a particular CH32V203 package does not expose
  # the host/device pins.  D8W-only functionality is intentionally not added.
  _delete:
    _registers:
      # The vendor SVD merged device registers with host aliases.  Split those
      # aliases so each mode gets the width/fields documented by chapter 22.
      - UEP2_RX_DMA__UH_RX_DMA
      - UEP3_TX_DMA__UH_TX_DMA
      - UEP12_TX_DMA____UH_SPLIT_DATA
      - UEP2_MAX_LEN__UH_RX_MAX_LEN
      - UEP2_T_LEN__UH_EP_PID
      - UEP2_R_CTRL__UH_RX_CTRL
      - UEP3_T_LEN___UH_TX_LEN_H
      - UEP3_T_CTRL___UH_TX_CTRL
    _interrupts:
      # CH32V20x D6/D8 do not have separate USBHS interrupt-vector entries.
      - USBHSWakeup
      - USBHS

  _modify:
    # Device endpoint DMA registers are 32-bit addresses in chapter 22.
    "UEP0_DMA,UEP*_RX_DMA*,UEP*_TX_DMA*":
      size: 32
    USB_INT_FG:
      resetValue: 0x00

  "UEP0_DMA,UEP*_RX_DMA*,UEP*_TX_DMA*":
    _modify:
      "*":
        bitRange: "[31:0]"

  USB_DEV_AD:
    _delete:
      # Bit 7 is reserved in chapter 22.
      - UDA_GP_BIT

  USB_USB_SUSPEND:
    _modify:
      # USB_WAKEUP_ST and USB_LINESTATE are hardware status fields.
      USB_WAKEUP:
        access: read-only
      USB_LINESTATE:
        access: read-only

  USB_INT_FG:
    _modify:
      "UIF_BUS_RST,UIF_TRANSFER,UIF_SUSPEND,UIF_HST_SOF,UIF_FIFO_OV":
        modifiedWriteValues: oneToClear
      # The table labels these status bits RO, but their descriptions explicitly
      # require software write-1-to-clear.  Expose that clearing operation.
      "U_SETUP_ACT,UIF_ISO_ACT":
        access: read-write
        modifiedWriteValues: oneToClear
    _delete:
      # Bit 7 is reserved in R8_USB_INT_FG; NAK state is reported by USB_INT_ST.
      - U_IS_NAK

  UEP0_T_CTRL:
    _delete:
      # Endpoint 0 does not support automatic transmit-toggle control.
      - bUEP_T_TOG_AUTO

  UEP0_R_CTRL:
    _delete:
      # Endpoint 0 does not support automatic receive-toggle control.
      - bUEP_R_TOG_AUTO

  _add:
    # --- Device-mode registers that were incorrectly merged with host aliases ---
    UEP2_RX_DMA:
      description: Endpoint 2 receive buffer start address
      addressOffset: 0x24
      size: 32
      access: read-write
      fields:
        UEP2_RX_DMA:
          description: Endpoint 2 receive buffer start address
          bitOffset: 0
          bitWidth: 32

    UEP3_TX_DMA:
      description: Endpoint 3 transmit buffer start address
      addressOffset: 0x64
      size: 32
      access: read-write
      fields:
        UEP3_TX_DMA:
          description: Endpoint 3 transmit buffer start address
          bitOffset: 0
          bitWidth: 32

    UEP12_TX_DMA:
      description: Endpoint 12 transmit buffer start address
      addressOffset: 0x88
      size: 32
      access: read-write
      fields:
        UEP12_TX_DMA:
          description: Endpoint 12 transmit buffer start address
          bitOffset: 0
          bitWidth: 32

    UEP2_MAX_LEN:
      description: Endpoint 2 maximum receive packet length
      addressOffset: 0xA0
      size: 16
      access: read-write
      fields:
        UEP2_MAX_LEN:
          description: Endpoint 2 maximum receive packet length
          bitOffset: 0
          bitWidth: 11

    UEP2_T_LEN:
      description: Endpoint 2 transmit length
      addressOffset: 0xE0
      size: 16
      access: read-write
      fields:
        UEP2_T_LEN:
          description: Endpoint 2 transmit byte count
          bitOffset: 0
          bitWidth: 11

    UEP2_R_CTRL:
      description: Endpoint 2 receive control register
      addressOffset: 0xE3
      size: 8
      access: read-write
      fields:
        MASK_UEP_R_RES:
          description: Endpoint 2 OUT response control
          bitOffset: 0
          bitWidth: 2
        MASK_UEP_R_TOG:
          description: Endpoint 2 expected receive data toggle
          bitOffset: 3
          bitWidth: 2
        bUEP_R_TOG_AUTO:
          description: Endpoint 2 automatic receive-toggle status/control as documented by the device register
          bitOffset: 5
          bitWidth: 1
          access: read-only

    UEP3_T_LEN:
      description: Endpoint 3 transmit length
      addressOffset: 0xE4
      size: 16
      access: read-write
      fields:
        UEP3_T_LEN:
          description: Endpoint 3 transmit byte count
          bitOffset: 0
          bitWidth: 11

    UEP3_T_CTRL:
      description: Endpoint 3 transmit control register
      addressOffset: 0xE6
      size: 8
      access: read-write
      fields:
        MASK_UEP_T_RES:
          description: Endpoint 3 IN response control
          bitOffset: 0
          bitWidth: 2
        MASK_UEP_T_TOG:
          description: Endpoint 3 transmit data toggle
          bitOffset: 3
          bitWidth: 2
        bUEP_T_TOG_AUTO:
          description: Endpoint 3 automatic transmit-toggle enable
          bitOffset: 5
          bitWidth: 1

    # --- Host-mode aliases from table 22-3 ---
    UH_CONFIG:
      description: USB host endpoint configuration register
      addressOffset: 0x10
      size: 32
      access: read-write
      fields:
        UH_EP_TX_EN:
          description: Host transmit endpoint enable control
          bitOffset: 3
          bitWidth: 1
        UH_EP_RX_EN:
          description: Host receive endpoint enable control
          bitOffset: 18
          bitWidth: 1

    UH_EP_TYPE:
      description: USB host endpoint type register
      addressOffset: 0x14
      size: 32
      access: read-write
      fields:
        UH_EP_TX_TYPE:
          description: Host transmit endpoint synchronous-transfer type
          bitOffset: 3
          bitWidth: 1
        UH_EP_RX_TYPE:
          description: Host receive endpoint synchronous-transfer type
          bitOffset: 18
          bitWidth: 1

    UH_RX_DMA:
      description: USB host receive buffer start address
      addressOffset: 0x24
      size: 32
      access: read-write
      fields:
        UH_RX_DMA:
          description: Host receive buffer address, low 17 address bits implemented
          bitOffset: 0
          bitWidth: 17

    UH_TX_DMA:
      description: USB host transmit buffer start address
      addressOffset: 0x64
      size: 32
      access: read-write
      fields:
        UH_TX_DMA:
          description: Host transmit buffer address, low 17 address bits implemented
          bitOffset: 0
          bitWidth: 17

    UH_RX_MAX_LEN:
      description: USB host receive maximum packet length
      addressOffset: 0xA0
      size: 16
      access: read-write
      fields:
        UH_RX_MAX_LEN:
          description: Host receive maximum packet length
          bitOffset: 0
          bitWidth: 11

    UH_EP_PID:
      description: USB host token and endpoint setup register
      addressOffset: 0xE0
      size: 8
      access: read-write
      fields:
        MASK_UH_ENDP:
          description: Target endpoint number
          bitOffset: 0
          bitWidth: 4
        MASK_UH_TOKEN:
          description: Token PID for the current host transaction
          bitOffset: 4
          bitWidth: 4

    UH_RX_CTRL:
      description: USB host receive endpoint control register
      addressOffset: 0xE3
      size: 8
      access: read-write
      fields:
        MASK_UH_R_RES:
          description: Host receive response control
          bitOffset: 0
          bitWidth: 2
        UH_R_RES_NO:
          description: Disable acknowledgement for applicable synchronous transfers
          bitOffset: 2
          bitWidth: 1
        MASK_UH_R_TOG:
          description: Expected receive data toggle
          bitOffset: 3
          bitWidth: 2
        UH_R_AUTO_TOG:
          description: Automatic receive-toggle enable
          bitOffset: 5
          bitWidth: 1
        UH_R_DATA_NO:
          description: Do not expect a data packet
          bitOffset: 6
          bitWidth: 1

    UH_TX_LEN:
      description: USB host transmit length register
      addressOffset: 0xE4
      size: 16
      access: read-write
      fields:
        UH_TX_LEN:
          description: Host transmit byte count
          bitOffset: 0
          bitWidth: 11

    UH_TX_CTRL:
      description: USB host transmit endpoint control register
      addressOffset: 0xE6
      size: 8
      access: read-write
      fields:
        MASK_UH_T_RES:
          description: Host transmit response control
          bitOffset: 0
          bitWidth: 2
        UH_T_RES_NO:
          description: Disable acknowledgement for applicable synchronous transfers
          bitOffset: 2
          bitWidth: 1
        MASK_UH_T_TOG:
          description: Transmit data toggle
          bitOffset: 3
          bitWidth: 2
        UH_T_AUTO_TOG:
          description: Automatic transmit-toggle enable
          bitOffset: 5
          bitWidth: 1
        UH_T_DATA_NO:
          description: Do not transmit a data packet
          bitOffset: 6
          bitWidth: 1

    UH_SPLIT_DATA:
      description: USB host SPLIT packet data register
      addressOffset: 0xE8
      size: 16
      access: read-write
      fields:
        UH_SPLIT_DATA:
          description: Low 12 bits of the SPLIT packet payload
          bitOffset: 0
          bitWidth: 12

